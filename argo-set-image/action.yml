name: "ArgoCD set image and commit"
description: "Test image via ArgoCD kustomize-image parameter, then commit to Git if stable"

inputs:
  registry:
    description: "Docker registry"
    required: false
    default: "registry.htz.tsof.news"
  repo:
    description: "Repository name (without registry), if not set will use github.event.repository.name"
    required: false
    default: ""
  tag:
    description: "Docker image tag (should be passed from docker-build-upload)"
    required: true
  argoapp:
    description: "ArgoCD application name"
    required: false
    default: ""
  image_name:
    description: "Image name in kustomization.yaml (defaults to repo value)"
    required: false
    default: ""
  extra_tag_paths:
    description: |
      Extra places carrying the same tag, one "<file>=<yq path>" per line, paths
      relative to k0s/apps. For images a kustomization cannot reach — a tag
      nested in an ArgoCD Application's Helm valuesObject, say. Each is written
      with the same tag and read back; a path that matches nothing fails the
      deploy rather than leaving the two versions to drift apart quietly.
    required: false
    default: ""
  helm_tag_path:
    description: |
      Helm mode: value path carrying the tag (e.g. hyperdx.image.tag). The image is
      set with --helm-set and the tag written to <argoapp>/application.yaml valuesObject.
    required: false
    default: ""
  source_position:
    description: "Helm mode: 1-based position in spec.sources (empty for a single spec.source)"
    required: false
    default: ""
  commit_message:
    description: "Manifest commit message (default: the triggering push's head commit message)"
    required: false
    default: ""
  timeout:
    description: "Timeout for app stabilization (e.g., 120)"
    required: false
    default: "120"
  git_user_name:
    description: "Git user name for commit"
    required: false
    default: "github-actions[bot]"
  git_user_email:
    description: "Git user email for commit"
    required: false
    default: "github-actions[bot]@truestory.work"

outputs:
  status:
    description: "Deployment status (success or failed)"
    value: ${{ steps.result.outputs.status }}

runs:
  using: "composite"
  steps:
    - name: Set variables
      id: vars
      shell: bash
      run: |
        REPO_FULL="${{ inputs.registry }}/${{ inputs.repo || github.event.repository.name }}"
        ARGOAPP="${{ inputs.argoapp || github.event.repository.name }}"
        KUSTOMIZE="${ARGOAPP}/kustomization.yaml"
        ARGOAPP="${ARGOAPP//_/-}"
        IMAGE_FULL="${REPO_FULL}:${{ inputs.tag }}"

        HELM_PATH="${{ inputs.helm_tag_path }}"
        POS="${{ inputs.source_position }}"
        # argocd v3 rejects `app set`/`unset` on a multi-source app without it
        SRC_ARGS="${POS:+--source-position ${POS}}"
        if [ -n "${HELM_PATH}" ]; then
          if [ -n "${POS}" ]; then
            SOURCE_YQ=".spec.sources[$((POS - 1))]"
          else
            SOURCE_YQ=".spec.source"
          fi
          UNSET_ARGS="${SRC_ARGS} --parameter ${HELM_PATH}"
          SET_ARGS="${SRC_ARGS} --helm-set ${HELM_PATH}=${{ inputs.tag }}"
          echo "HELM_TAG_ENTRY=${KUSTOMIZE%/*}/application.yaml=${SOURCE_YQ}.helm.valuesObject.${HELM_PATH}" >> $GITHUB_ENV
        else
          SET_ARGS="--kustomize-image=${IMAGE_FULL}"
          UNSET_ARGS="${SET_ARGS}"
        fi
        echo "SET_ARGS=${SET_ARGS}" >> $GITHUB_ENV
        echo "UNSET_ARGS=${UNSET_ARGS}" >> $GITHUB_ENV

        echo "REPO_FULL=${REPO_FULL}" >> $GITHUB_ENV
        echo "IMAGE_FULL=${IMAGE_FULL}" >> $GITHUB_ENV
        echo "ARGOAPP=${ARGOAPP}" >> $GITHUB_ENV
        echo "KUSTOMIZE=${KUSTOMIZE}" >> $GITHUB_ENV

        echo "### Deploy \`${ARGOAPP}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Image:** \`${IMAGE_FULL}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

    # truestory-infra GitHub App; key is put on runners by k0s/apps/github-actions
    - name: GitHub App token (deployments, contents:write)
      id: app-token
      shell: bash
      env:
        APP_ID: "5753016"
        INSTALLATION_ID: "181779909"
        APP_KEY: /home/runner/.config/truestory-infra.pem
      run: |
        b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
        now=$(date +%s)
        jwt="$(printf '{"alg":"RS256","typ":"JWT"}' | b64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now - 60)) $((now + 540)) "${APP_ID}" | b64)"
        jwt="${jwt}.$(printf %s "${jwt}" | openssl dgst -sha256 -sign "${APP_KEY}" | b64)"
        token=$(curl -fsS -X POST -H "Authorization: Bearer ${jwt}" -H "Accept: application/vnd.github+json" \
          -d '{"repositories":["deployments"],"permissions":{"contents":"write"}}' \
          "https://api.github.com/app/installations/${INSTALLATION_ID}/access_tokens" | jq -r .token)
        echo "::add-mask::${token}"
        echo "token=${token}" >> "$GITHUB_OUTPUT"

    - name: Checkout deployments
      uses: actions/checkout@v7
      with:
        ref: refs/heads/main
        show-progress: false
        repository: theverytruestory/deployments
        token: ${{ steps.app-token.outputs.token }}
        sparse-checkout: k0s/apps
        path: deployments
        fetch-depth: 1

    - name: Save current state
      working-directory: deployments/k0s/apps
      shell: bash
      run: |
        echo "Fetching current app state..."
        argocd --core app get ${{ env.ARGOAPP }} -o tree > /tmp/before.txt 2>&1 || true

    - name: Set image ${{ env.IMAGE_FULL }}
      working-directory: deployments/k0s/apps
      shell: bash
      run: |
        # sync policy stays as in git: toggling it made the child OutOfSync in app-of-apps,
        # and any push to deployments mid-deploy reverted the override
        echo "Setting image to ${{ env.IMAGE_FULL }}..."
        argocd --core app set ${{ env.ARGOAPP }} ${SET_ARGS}

    - name: Sync ${{ env.IMAGE_FULL }}
      working-directory: deployments/k0s/apps
      shell: bash
      run: |
        # without this the health wait below may see the old pods
        if ! argocd --core app sync ${{ env.ARGOAPP }} --timeout ${{ inputs.timeout }}; then
          # auto-sync picked up the override first: let it finish, then sync once more
          argocd --core app wait ${{ env.ARGOAPP }} --operation --timeout ${{ inputs.timeout }}
          argocd --core app sync ${{ env.ARGOAPP }} --timeout ${{ inputs.timeout }}
        fi

    - name: Wait for healthy (timeout ${{ inputs.timeout }}s)
      working-directory: deployments/k0s/apps
      shell: bash
      run: |
        echo "Waiting for app to become healthy..."
        echo "<details><summary>ArgoCD wait output</summary>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        argocd --core app wait ${{ env.ARGOAPP }} --timeout ${{ inputs.timeout }} --health -o tree 2>&1 | tee -a $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "</details>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

    - name: Verify ${{ env.IMAGE_FULL }} is live
      working-directory: deployments/k0s/apps
      shell: bash
      run: |
        # Healthy alone may describe the old template if something reverted the override;
        # check workload specs (pods linger while terminating) and wait for their rollout
        workloads=$(argocd --core app get ${{ env.ARGOAPP }} -o json | jq -r \
          '.status.resources[] | select(.kind == "Deployment" or .kind == "StatefulSet" or .kind == "DaemonSet") | "\(.namespace) \(.kind)/\(.name)"')
        found=0
        while read -r ns wl; do
          [ -z "${ns}" ] && continue
          images=$(kubectl get -n "${ns}" "${wl}" -o json | jq -r \
            '.spec.template.spec | [.containers[]?, .initContainers[]?] | .[].image' | grep "^${REPO_FULL}[:@]" || true)
          [ -z "${images}" ] && continue
          echo "${ns} ${wl}: ${images//$'\n'/ }"
          if grep -vqxF "${IMAGE_FULL}" <<< "${images}"; then
            echo "::error::${ns} ${wl} does not run ${IMAGE_FULL}"
            exit 1
          fi
          kubectl rollout status -n "${ns}" "${wl}" --timeout=${{ inputs.timeout }}s
          found=$((found + 1))
        done <<< "${workloads}"
        if [ "${found}" -eq 0 ]; then
          echo "::error::no workload of ${{ env.ARGOAPP }} uses ${REPO_FULL}"
          exit 1
        fi

    - name: Commit manifest update
      working-directory: deployments/k0s/apps
      shell: bash
      env:
        # Through env, not inline: Actions substitutes expressions before bash
        # parses the script, so an apostrophe in a commit message broke the
        # quoting outright and a crafted one would run on the runner.
        HEAD_COMMIT_MESSAGE: ${{ inputs.commit_message || github.event.head_commit.message }}
        EXTRA_TAG_PATHS: ${{ inputs.extra_tag_paths }}
        TRIGGER_ACTOR: ${{ github.actor }}
        SOURCE_REPO: ${{ github.event.repository.name }}
        SOURCE_RUN_NUMBER: ${{ github.run_number }}
      run: |
        set -e

        git config --global user.name "${{ inputs.git_user_name }}"
        git config --global user.email "${{ inputs.git_user_email }}"

        TAG_PATHS="${EXTRA_TAG_PATHS}"
        if [ -n "${HELM_TAG_ENTRY:-}" ]; then
          TAG_PATHS="${HELM_TAG_ENTRY}"$'\n'"${TAG_PATHS}"
        else
          yq eval '(.images[] | select(.name == "${{ env.REPO_FULL }}") | .newTag) = "${{ inputs.tag }}"' -i ${{ env.KUSTOMIZE }}
          git add ${{ env.KUSTOMIZE }}
        fi

        # Те же теги в местах, до которых kustomization не дотягивается.
        # Читаем обратно: yq на несуществующем пути молча создаст ветку или
        # не сделает ничего, и версии разъедутся без единого сообщения.
        while IFS= read -r entry; do
          [ -z "${entry}" ] && continue
          file="${entry%%=*}"
          path="${entry#*=}"
          if [ ! -f "${file}" ]; then
            echo "extra_tag_paths: файла нет: ${file}" >&2
            exit 1
          fi
          # Сначала убеждаемся, что путь существует. `yq = value` на
          # несуществующем пути СОЗДАЁТ ветку, поэтому чтение после записи
          # опечатку не ловит: оно вернёт только что придуманное значение,
          # а в файл добавится секция, которую никто не читает.
          before="$(yq eval "${path}" "${file}")"
          if [ -z "${before}" ] || [ "${before}" = "null" ]; then
            echo "extra_tag_paths: пути нет в ${file}: ${path}" >&2
            exit 1
          fi
          yq eval "${path} = \"${{ inputs.tag }}\"" -i "${file}"
          got="$(yq eval "${path}" "${file}")"
          if [ "${got}" != "${{ inputs.tag }}" ]; then
            echo "extra_tag_paths: ${file} ${path} = '${got}', ожидался '${{ inputs.tag }}'" >&2
            exit 1
          fi
          echo "extra tag set: ${file} ${path}"
          git add "${file}"
        done <<< "${TAG_PATHS}"

        echo "<details><summary>Manifest diff</summary>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo '```diff' >> $GITHUB_STEP_SUMMARY
        git diff --cached -U0 >> $GITHUB_STEP_SUMMARY || true
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "</details>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if git diff --cached --quiet; then
          echo "No changes to commit (tag already up to date)"
          echo "**Result:** No changes - tag already matches" >> $GITHUB_STEP_SUMMARY
        else
          msg="${TRIGGER_ACTOR}@${SOURCE_REPO}#${SOURCE_RUN_NUMBER}: ${HEAD_COMMIT_MESSAGE}"
          git commit -m "${msg}"
          git push origin main
          echo "**Result:** Committed and pushed manifest update" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Rollback on failure
      if: failure()
      working-directory: deployments/k0s/apps
      shell: bash
      run: |
        echo ""
        echo "### Deployment failed - rolling back" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "Unsetting image..."
        argocd --core app unset ${{ env.ARGOAPP }} ${UNSET_ARGS} 2>&1 || true

        echo "Syncing back..."
        argocd --core app sync ${{ env.ARGOAPP }} --timeout ${{ inputs.timeout }} 2>&1 || true

        echo "Waiting for rollback..."
        echo "<details><summary>Rollback output</summary>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        argocd --core app wait ${{ env.ARGOAPP }} --timeout ${{ inputs.timeout }} --health -o tree 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "</details>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "<details><summary>State before deploy</summary>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat /tmp/before.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No saved state" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "</details>" >> $GITHUB_STEP_SUMMARY

    - name: Revoke GitHub App token
      if: always() && steps.app-token.outputs.token != ''
      shell: bash
      env:
        TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        curl -fsS -X DELETE -H "Authorization: token ${TOKEN}" https://api.github.com/installation/token
